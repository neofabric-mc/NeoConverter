name: Build NeoConverter
on: [push, pull_request, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install -r requirements-build.txt
      - name: Test core and native Windows GUI
        run: python -m unittest discover -s tests -v
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name NeoConverter --version-file version_info.txt NeoConverter.py
      - name: Verify bundled GUI and conversion
        run: python scripts/check_packaged.py dist/NeoConverter.exe
      - uses: actions/upload-artifact@v4
        with:
          name: NeoConverter-Windows
          path: dist/NeoConverter.exe
          if-no-files-found: error
